name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'PiPhi-io/piphi_network_widget_sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Use an OIDC-capable npm CLI
        run: npm install --global "npm@^11.5.1"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: node scripts/verify-release.mjs "${GITHUB_REF_NAME}"

      - name: Typecheck
        run: npm run check

      - name: Test and build
        run: npm test

      - name: Verify reference-widget conformance
        run: npm run widget:conformance

      - name: Verify publish contents
        run: npm pack --dry-run

      - name: Read package identity
        id: package
        run: |
          node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; console.log('name=' + pkg.name); console.log('version=' + pkg.version)" >> "${GITHUB_OUTPUT}"

      - name: Check whether version is already published
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --json > /dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish package with trusted publishing
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
          fi
